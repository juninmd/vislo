[package]
name = "openpic"
version = "0.1.0"
description = "Fast image viewer: open a file, flip through its folder."
edition = "2021"

[lib]
name = "openpic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
natord = "1"
dunce = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
