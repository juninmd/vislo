[package]
name = "vislo"
version = "0.13.13"
description = "Fast image viewer: open a file, flip through its folder."
edition = "2021"
license = "MIT"

[workspace]
members = ["vislo-core"]

[lib]
name = "vislo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vislo-core = { path = "vislo-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
natord = "1"
dunce = "1"
percent-encoding = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico", "tga", "pnm", "hdr", "exr", "qoi", "dds", "ff"] }
fast_image_resize = { version = "6", features = ["image"] }
flate2 = "1"
serde_json = "1"
tauri-plugin-dialog = "2"
arboard = { version = "3", default-features = false, features = ["image-data"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-collections = "0.3"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "ApplicationModel_DataTransfer", "Foundation_Collections", "Storage", "Storage_Streams", "System_UserProfile"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind" # decoder panics are caught per request (see lib.rs, pool.rs)
strip = true

# Quick local builds for performance work: release code generation without the long LTO link.
[profile.devrel]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
