[package]
name = "vislo"
version = "0.1.0"
description = "Fast image viewer: open a file, flip through its folder."
edition = "2021"

[lib]
name = "vislo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
natord = "1"
dunce = "1"
percent-encoding = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico"] }
fast_image_resize = { version = "6", features = ["image"] }
kamadak-exif = "0.6"
psd = "0.3"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
