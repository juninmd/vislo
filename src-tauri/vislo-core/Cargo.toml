[package]
name = "vislo-core"
version = "0.1.0"
description = "Vislo's image decoding without the UI: format detection, decoders, EXIF, thumbnails and resizing."
edition = "2021"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico", "tga", "pnm", "hdr", "exr", "qoi", "dds", "ff"] }
fast_image_resize = { version = "6", features = ["image"] }
image-extras = { version = "0.1", default-features = false, features = ["icns", "otb", "pcx", "sgi", "wbmp", "xbm", "xpm"] }
flate2 = "1"
kamadak-exif = "0.6"
jpeg-decoder = { version = "0.3", default-features = false }
psd = "0.3"
jxl-oxide = { version = "0.12", features = ["image", "moxcms"] }
hayro-jpeg2000 = "0.5"
hayro-jbig2 = "0.4"
hayro-ccitt = "0.5"
djvu-rs = { version = "0.44", default-features = false, features = ["std"] }
texture2ddecoder = { version = "0.1.2", default-features = false, features = ["alloc"] }
jpeg-encoder = { version = "0.7.1", features = ["simd"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }
