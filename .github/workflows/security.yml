name: Security Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  scan:
    # the reusable job needs only contents: read; a called workflow cannot exceed this ceiling
    permissions:
      contents: read
    uses: juninmd/base-actions/.github/workflows/reusable-security-scan.yml@main
