name: release

# Every push to main ships: the version is derived from the semantic commits since the last tag,
# the installer is built, a tag and a GitHub release are created, and running copies of Vislo
# pick the release up through their built-in updater (src-tauri/src/update.rs).

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false # releases are strictly ordered; a newer push waits for the one in flight

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    # the job's own version commit must not release again
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: windows-latest
    timeout-minutes: 45 # recent runs took ~9 min; the limit only stops a hung build from billing for 6 hours
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and history are needed to plan the version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # a branch ref, so the SHA is pinned and the toolchain is passed explicitly
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Plan the version
        id: plan
        run: |
          node scripts/release.mjs plan > plan.json
          VERSION=$(node -p "require('./plan.json').version || ''")
          node -p "require('./plan.json').notes || ''" > notes.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Next version: ${VERSION:-none}"

      - name: Stamp the version
        if: steps.plan.outputs.version != ''
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: node scripts/release.mjs stamp "$VERSION"

      - name: Build the installer
        if: steps.plan.outputs.version != ''
        run: |
          npm ci
          npm run tauri build

      - name: Collect release assets
        if: steps.plan.outputs.version != ''
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          V="$VERSION"
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "out/Vislo_${V}_x64-setup.exe"
          cp src-tauri/target/release/vislo.exe "out/Vislo_${V}_x64-portable.exe"
          (cd out && sha256sum * > ../SHA256SUMS.txt) # `sha256sum *` prints `<hex>  <name>` per file, in glob (sorted) order
          mv SHA256SUMS.txt out/
          cat out/SHA256SUMS.txt

      - name: Commit the version, tag and publish
        if: steps.plan.outputs.version != ''
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          V="$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git commit -m "chore(release): v${V} [skip ci]"
          TARGET="$GITHUB_SHA"
          git fetch origin main
          if git rebase origin/main && git tag -a "v${V}" -m "Vislo v${V}" && git push --atomic origin HEAD:main "v${V}"; then
            TARGET="$(git rev-parse HEAD)"
          else
            echo "::warning::could not push the version commit to main (protected branch?); tagging the built commit instead"
            git rebase --abort 2>/dev/null || true
          fi
          gh release create "v${V}" out/* \
            --target "$TARGET" \
            --title "Vislo v${V}" \
            --notes-file notes.md
