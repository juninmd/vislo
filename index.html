<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vislo</title>
  </head>
  <body>
    <div id="app" class="strip-off">
      <div id="stage"></div>
      <div id="empty">
        <p>Open an image with <b>Vislo</b></p>
        <small>or drop a file here</small>
        <button id="btn-assoc" type="button">Set as default image viewer</button>
      </div>
      <div id="msg" role="status"></div>
      <div id="zoomtip" role="status" aria-live="polite"></div>
      <header class="hud">
        <span id="name"></span>
        <span id="count"></span>
        <span class="spacer"></span>
        <button id="btn-strip" title="Filmstrip (T)" aria-label="Toggle filmstrip">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="9" rx="1.5"/><rect x="3" y="17" width="4" height="3" rx="1"/><rect x="10" y="17" width="4" height="3" rx="1"/><rect x="17" y="17" width="4" height="3" rx="1"/></svg>
        </button>
        <button id="btn-full" title="Fullscreen (F11)" aria-label="Toggle fullscreen">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none"/></svg>
        </button>
      </header>
      <button id="prev" class="nav" title="Previous (←)" aria-label="Previous image">‹</button>
      <button id="next" class="nav" title="Next (→)" aria-label="Next image">›</button>
      <div id="strip" aria-label="Filmstrip"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
