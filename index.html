<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vislo</title>
  </head>
  <body>
    <div id="app" class="bg-dark">
      <div id="stage"></div>
      <div id="empty">
        <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="10" width="52" height="44" rx="9"/><circle cx="22" cy="26" r="5"/><path d="M8 46l15-14 11 10 8-7 15 14"/></svg>
        <p>Open an image with <b>Vislo</b></p>
        <small>or drop a file anywhere in this window</small>
        <button id="btn-open" class="assoc" type="button">Open image… <kbd>O</kbd></button>
        <button id="btn-assoc" class="assoc" type="button">Set as default image viewer</button>
      </div>
      <div id="msg" role="status"></div>
      <div id="update" role="status" hidden>
        <span id="update-text"></span>
        <button id="update-go" type="button">Update &amp; restart</button>
        <button id="update-later" type="button" aria-label="Dismiss" title="Later">✕</button>
      </div>
      <div id="zoomtip" role="status" aria-live="polite"></div>
      <div id="caption"></div>
      <header class="hud">
        <span id="name"></span>
        <span id="dims"></span>
        <span id="count"></span>
        <span class="spacer"></span>
        <button id="btn-rot-l" title="Rotate left (Shift+R)" aria-label="Rotate left">
          <svg viewBox="0 0 24 24"><path d="M4 9a8 8 0 1 1-1 5"/><path d="M4 4v5h5"/></svg>
        </button>
        <button id="btn-rot-r" title="Rotate right (R)" aria-label="Rotate right">
          <svg viewBox="0 0 24 24"><path d="M20 9a8 8 0 1 0 1 5"/><path d="M20 4v5h-5"/></svg>
        </button>
        <button id="btn-show" title="Slideshow (S)" aria-label="Start slideshow">
          <svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>
        </button>
        <button id="btn-info" title="Info (I)" aria-label="Toggle info panel">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
        </button>
        <button id="btn-strip" title="Filmstrip (T)" aria-label="Toggle filmstrip">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="9" rx="1.5"/><rect x="3" y="17" width="4" height="3" rx="1"/><rect x="10" y="17" width="4" height="3" rx="1"/><rect x="17" y="17" width="4" height="3" rx="1"/></svg>
        </button>
        <button id="btn-gear" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>
        </button>
        <button id="btn-full" title="Full screen (F11)" aria-label="Toggle full screen">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none"/></svg>
        </button>
        <button id="btn-max" class="frame" title="Maximize (double-click the bar)" aria-label="Maximize">
          <svg class="ico-max" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1.5"/></svg>
          <svg class="ico-restore" viewBox="0 0 24 24"><rect x="4" y="9" width="11" height="11" rx="1.5"/><path d="M9 9V5.5A1.5 1.5 0 0 1 10.5 4H18.5A1.5 1.5 0 0 1 20 5.5V13.5A1.5 1.5 0 0 1 18.5 15H15"/></svg>
        </button>
        <button id="btn-min" class="frame" title="Minimise" aria-label="Minimise">
          <svg viewBox="0 0 24 24"><path d="M5 18h14"/></svg>
        </button>
        <button id="btn-close" class="frame" title="Close (Esc)" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <aside id="info" aria-label="Image information"></aside>
      <aside id="panel" aria-label="Settings">
        <h2>Settings</h2>
        <h3>Viewing</h3>
        <label>Mouse wheel
          <select id="s-wheel"><option value="zoom">Zoom</option><option value="navigate">Previous / next image</option></select>
        </label>
        <label class="check"><input type="checkbox" id="s-autohide" /> Auto-hide controls</label>
        <label class="check"><input type="checkbox" id="s-sharp" /> Sharp downscaling</label>
        <label class="check"><input type="checkbox" id="s-preview" /> Instant preview for large photos</label>
        <label class="check"><input type="checkbox" id="s-3d" /> 3D filmstrip</label>
        <label class="check"><input type="checkbox" id="s-hover" /> Filmstrip hover preview</label>
        <h3>Slideshow</h3>
        <label>Show each picture for (s) <input type="number" id="s-display" min="0.5" max="60" step="0.5" /></label>
        <label>Cross-fade (s) <input type="number" id="s-fade" min="0" max="5" step="0.5" /></label>
        <h3>Window</h3>
        <label class="check"><input type="checkbox" id="s-max" /> Open maximized <em>(next launch)</em></label>
        <label class="check"><input type="checkbox" id="s-fs" /> Open in fullscreen <em>(next launch)</em></label>
        <label>Background (next launch)
          <select id="s-bg"><option value="dark">Dark</option><option value="black">Black</option><option value="transparent">Transparent</option></select>
        </label>
        <label class="check"><input type="checkbox" id="s-keep" /> Keep ready in tray <em>(opens faster)</em></label>
        <label class="check"><input type="checkbox" id="s-login" /> Start ready when I sign in</label>
        <h3>Updates</h3>
        <label class="check"><input type="checkbox" id="s-updates" /> Check for updates automatically</label>
        <div class="about">
          <span id="s-version">Vislo</span>
          <button id="btn-update-check" class="assoc" type="button">Check for updates</button>
        </div>
        <fieldset id="s-groups">
          <legend>Default viewer for</legend>
          <label class="check"><input type="checkbox" data-group="jpeg" checked /> JPEG</label>
          <label class="check"><input type="checkbox" data-group="png" checked /> PNG</label>
          <label class="check"><input type="checkbox" data-group="gif" checked /> GIF</label>
          <label class="check"><input type="checkbox" data-group="bmp" checked /> BMP</label>
          <label class="check"><input type="checkbox" data-group="tiff" checked /> TIFF</label>
          <label class="check"><input type="checkbox" data-group="tga" checked /> TGA</label>
          <label class="check"><input type="checkbox" data-group="webp" checked /> WebP</label>
          <label class="check"><input type="checkbox" data-group="avif" checked /> AVIF</label>
          <label class="check"><input type="checkbox" data-group="ico" checked /> ICO/CUR</label>
          <label class="check"><input type="checkbox" data-group="svg" checked /> SVG</label>
          <label class="check"><input type="checkbox" data-group="jxl" checked /> JPEG XL</label>
          <label class="check"><input type="checkbox" data-group="jp2" checked /> JP2</label>
          <label class="check"><input type="checkbox" data-group="psd" checked /> PSD</label>
          <label class="check"><input type="checkbox" data-group="pnm" checked /> PNM</label>
          <label class="check"><input type="checkbox" data-group="hdr" checked /> HDR / EXR</label>
          <label class="check"><input type="checkbox" data-group="other" checked /> DDS / QOI / FF</label>
          <label class="check"><input type="checkbox" data-group="raw" checked /> RAW</label>
        </fieldset>
        <button id="btn-assoc-panel" class="assoc" type="button">Set as default image viewer</button>
      </aside>
      <button id="prev" class="nav" title="Previous (←)" aria-label="Previous image">‹</button>
      <button id="next" class="nav" title="Next (→)" aria-label="Next image">›</button>
      <div id="hover" aria-hidden="true"></div>
      <div id="ctxmenu" role="menu" aria-label="Image actions" hidden></div>
      <div id="strip" aria-label="Filmstrip"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
